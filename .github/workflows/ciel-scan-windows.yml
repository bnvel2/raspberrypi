name: Construire ciel-scan.exe (Windows)

# Se lance à la demande : onglet « Actions », « Construire ciel-scan.exe (Windows) », « Run workflow ».
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: espace-claude/logiciel/ciel-scan
    steps:
      - uses: actions/checkout@v4

      # Les tests tournent aussi sous Windows : ils valident le code propre à ce système.
      - name: Tests
        run: cargo test --release

      - name: Compilation
        run: cargo build --release

      - name: Publier l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: ciel-scan-windows
          path: espace-claude/logiciel/ciel-scan/target/release/ciel-scan.exe

      # Range aussi l'exécutable dans l'onglet « logiciel » du dépôt, à côté des autres programmes.
      - name: Ranger l'exécutable dans le dépôt
        shell: bash
        working-directory: .
        run: |
          cp espace-claude/logiciel/ciel-scan/target/release/ciel-scan.exe espace-claude/logiciel/ciel-scan.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add espace-claude/logiciel/ciel-scan.exe
          git commit -m "ciel-scan.exe compilé sous Windows" || exit 0
          git push
