section.panel h2{margin:0 0 12px;color:var(--c)}

.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{border:1px solid var(--bd);padding:7px 10px;text-align:left;vertical-align:top}
th{background:hsl(var(--h) 60% var(--tint));color:var(--txt)}
ul.obj{padding-left:20px}
.code{border-radius:10px;overflow:hidden;margin:12px 0;background:var(--code)}
.code .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:hsl(var(--h) 55% 30%);color:#fff;font-weight:600}
.code .bar button{font:inherit;font-size:.85rem;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;background:#ffffff26;color:#fff}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;color:var(--codetxt);font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.code .p{color:var(--prompt)}.code .m{color:var(--cmd)}.code .c{color:var(--cmt);font-style:italic}
.note{border-left:4px solid var(--c);background:hsl(var(--h) 60% var(--tint));padding:8px 12px;border-radius:6px;margin:10px 0}
/* schéma */
.schema{overflow-x:auto}
.schema svg{width:100%;min-width:720px;height:auto;display:block}
.schema text{fill:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.schema .nm{font-weight:700;font-size:15px;fill:#fff}
.schema .if{font-size:12px;font-weight:600}
.schema .ip{font-size:12px;fill:var(--mut)}
.schema .lk{stroke:var(--mut);stroke-width:2.5;fill:none}
.schema .tr{stroke:#e74c3c;stroke-width:5;stroke-dasharray:10 6;fill:none}
.schema .ifbg{fill:var(--card);stroke:var(--bd)}
/* qcm */
.q{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:12px 0}
.q.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.q.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 12%,transparent)}
.q p{margin:0 0 8px;font-weight:600}
.q label{display:block;padding:4px 6px;border-radius:6px;cursor:pointer}
.q label:hover{background:hsl(var(--h) 60% var(--tint))}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 18px;background:var(--c);color:#fff;cursor:pointer}
#score{font-weight:700;margin-left:12px}
.grille{font-family:ui-monospace,Menlo,Consolas,monospace;word-spacing:6px}
</style>

    "Corriger chaque panne en CLI et vérifier après chaque correction",
    "Compléter le tableau symptôme / cause / solution"
  ],
  materiel: ["1 routeur Cisco 2911 (R1)", "2 switchs Cisco 2960-24TT (SW1, SW2)", "4 PC-PT (PC1 à PC4)", "Le fichier Packet Tracer de départ préparé par le professeur (configurations de l’onglet « Config CLI »)"],

  consignes: [
    "Le plan d’adressage de l’onglet « Adressage » est la référence : c’est la configuration voulue. Toute différence est une panne.",
    "Il y a 5 pannes. Certaines en cachent d’autres : une panne n’apparaît parfois qu’après la correction de la précédente.",
    "Corrigez une seule chose à la fois, puis vérifiez. Après chaque correction côté DHCP, renouvelez l’adresse des PC (Desktop > IP Configuration : passer en Static puis revenir en DHCP).",
    "Il est interdit d’effacer les configurations (erase startup-config, reload) : on dépanne, on ne refait pas tout."
  ],
  fiche: {

      ["VLAN 10 — COMPTA", "192.168.10.0", "255.255.255.0 (/24)", "192.168.10.1", "192.168.10.11 – .254 (.1 à .10 exclues)"],
      ["VLAN 20 — RH", "192.168.20.0", "255.255.255.0 (/24)", "192.168.20.1", "192.168.20.11 – .254 (.1 à .10 exclues)"]

  adressage: {

    { appareil: "R1 — configuration de départ AVEC PANNES (professeur)", lignes: `! Base

Router#configure terminal
Router(config)#hostname R1
R1(config)#no ip domain-lookup
R1(config)#enable secret cisco
R1(config)#line console 0
R1(config-line)#password cisco

R1(config-subif)#exit

/* =============================================================== */

const L = ["A", "B", "C", "D"];
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function table(t) {
  const w = el("div", "wrap"), tb = el("table"), th = el("thead"), tr = el("tr");
  t.entetes.forEach(h => tr.append(el("th", "", h))); th.append(tr); tb.append(th);
  const body = el("tbody");
  t.lignes.forEach(r => { const row = el("tr"); r.forEach(c => row.append(el("td", "", c))); body.append(row); });
  tb.append(body); w.append(tb); return w;
}
const PROMPT = /^([^\s>#]+(?:\([^)]*\))?[>#])(.*)$/;
function code(titre, texte, h) {
  const box = el("div", "code"); box.style.setProperty("--h", h);
  const bar = el("div", "bar"); bar.append(el("span", "", titre));
  const btn = el("button", "", "Copier les commandes"); btn.type = "button"; bar.append(btn);
  const pre = el("pre"); const cmds = [];
  texte.split("\n").forEach((ligne, i) => {
    if (i) pre.append("\n");
    if (ligne.trim().startsWith("!")) { pre.append(el("span", "c", ligne)); return; }
    const m = ligne.match(PROMPT);
    if (m) { pre.append(el("span", "p", m[1]), el("span", "m", m[2])); cmds.push(m[2]); }
    else { pre.append(ligne); }
  });
  btn.onclick = async () => {
    const t = cmds.join("\n");
    try { await navigator.clipboard.writeText(t); btn.textContent = "Copié ✔"; }
    catch (e) { const ta = el("textarea"); ta.value = t; document.body.append(ta); ta.select(); try { document.execCommand("copy"); btn.textContent = "Copié ✔"; } catch (e2) { btn.textContent = "Copie impossible"; } ta.remove(); }
    setTimeout(() => btn.textContent = "Copier les commandes", 1800);
  };
  box.append(bar, pre); return box;
}
function P(id) { return document.getElementById(id); }
function hue(id) { return P(id).dataset.h; }

/* En-tête */
document.title = TP.titre; P("titre").textContent = TP.titre; P("soustitre").textContent = TP.sousTitre;

/* Énoncé */
(function () {
  const s = P("enonce"); s.append(el("h2", "", "Énoncé du TP"));
  TP.enonce.forEach(t => s.append(el("p", "", t)));
  s.append(el("h3", "", "Objectifs")); const ul = el("ul", "obj"); TP.objectifs.forEach(o => ul.append(el("li", "", o))); s.append(ul);
  s.append(el("h3", "", "Matériel")); const um = el("ul", "obj"); TP.materiel.forEach(o => um.append(el("li", "", o))); s.append(um);
})();

/* Adressage */
(function () {
  const s = P("adressage"); s.append(el("h2", "", "Plan d’adressage"));
  s.append(el("h3", "", "Réseaux")); s.append(table(TP.reseaux));
  s.append(el("h3", "", "Adresses des appareils")); s.append(table(TP.adressage));
  s.append(el("h3", "", "Table des liens (câblage)")); s.append(table(TP.liens));
  if (TP.flux) { s.append(el("h3", "", "Politique de filtrage (matrice des flux)")); s.append(table(TP.flux)); }
})();

/* Configuration CLI */
(function () {
  const s = P("config"); s.append(el("h2", "", "Configuration CLI"));
  s.append(el("div", "note", "Chaque commande est précédée de son prompt. Le bouton « Copier » ne copie que les commandes, sans les prompts."));
  TP.configs.forEach(c => s.append(code(c.appareil, c.lignes, hue("config"))));
  (TP.configNotes || []).forEach(n => s.append(el("div", "note", n)));
})();

/* Vérifications */
(function () {
  const s = P("tests"); s.append(el("h2", "", "Vérifications et tests"));
  TP.tests.forEach(t => s.append(code(t.titre, t.lignes, hue("tests"))));
  (TP.testsNotes || []).forEach(n => s.append(el("div", "note", n)));
})();


/* Ticket d'incident, consignes et fiche élève (onglet Énoncé) */
(function () {
  const s = P("enonce");
  s.append(el("h3", "", "🎫 Ticket d’incident n° 2611-07 — priorité haute"));
  s.append(table(TP.ticket));
  s.append(el("h3", "", "Consignes"));
  const ul = el("ul", "obj"); TP.consignes.forEach(o => ul.append(el("li", "", o))); s.append(ul);
  s.append(el("h3", "", "Fiche d’intervention à compléter"));
  s.append(table(TP.fiche));
})();

/* Corrigé du dépannage */
(function () {
  const s = P("depannage"); s.append(el("h2", "", "Corrigé du dépannage"));
  s.append(el("div", "note", "Onglet réservé au professeur. Les pannes sont numérotées dans l’ordre de traitement conseillé."));
  s.append(el("h3", "", "Tableau symptôme / cause / solution"));
  s.append(table(TP.depannage));
  s.append(el("h3", "", "Commandes de réparation"));
  TP.reparations.forEach(r => s.append(code(r.titre, r.lignes, hue("depannage"))));
  (TP.depannageNotes || []).forEach(n => s.append(el("div", "note", n)));
})();

/* QCM */
(function () {
  const s = P("qcm"); s.append(el("h2", "", "QCM — " + TP.qcm.length + " questions"));
  const cards = [];
  TP.qcm.forEach((q, i) => {
    const c = el("div", "q"); c.append(el("p", "", (i + 1) + ". " + q.q));
    q.o.forEach((o, j) => {
      const lab = el("label"); const r = el("input"); r.type = "radio"; r.name = "q" + i; r.value = j;
      lab.append(r, " " + L[j] + ". " + o); c.append(lab);
    });
    cards.push(c); s.append(c);
  });
  const btn = el("button", "btn", "Valider mes réponses"); btn.type = "button";
  const sc = el("span"); sc.id = "score"; sc.setAttribute("aria-live", "polite");
  btn.onclick = () => {
    let ok = 0;
    TP.qcm.forEach((q, i) => {
      const ch = document.querySelector('input[name="q' + i + '"]:checked');
      const good = ch && Number(ch.value) === q.r; if (good) ok++;
      cards[i].classList.toggle("ok", !!good); cards[i].classList.toggle("ko", !good);
    });
    sc.textContent = "Score : " + ok + " / " + TP.qcm.length + " — explications dans l’onglet Corrigé";
  };
  s.append(btn, sc);
})();

/* Corrigé */
(function () {
  const s = P("corrige"); s.append(el("h2", "", "Corrigé du QCM"));
  const g = el("p", "grille", TP.qcm.map((q, i) => (i + 1) + "-" + L[q.r]).join("  ·  ")); s.append(g);
  TP.qcm.forEach((q, i) => {
    const c = el("div", "q"); c.append(el("p", "", (i + 1) + ". " + q.q));
    c.append(el("div", "", "Réponse " + L[q.r] + " — " + q.o[q.r])); c.append(el("div", "note", q.e)); s.append(c);
  });
})();

/* Onglets */
const panels = Array.from(document.querySelectorAll("section.panel")), nav = P("tabs");
panels.forEach((p, i) => {
  p.style.setProperty("--h", p.dataset.h);
  const b = el("button", "tab", p.dataset.label); b.type = "button"; b.setAttribute("role", "tab");
  b.style.setProperty("--h", p.dataset.h); b.onclick = () => show(i); nav.append(b);
});
function show(i, noHash) {
  panels.forEach((p, j) => { p.hidden = j !== i; nav.children[j].classList.toggle("on", j === i); nav.children[j].setAttribute("aria-selected", j === i ? "true" : "false"); });
  if (!noHash) { try { history.replaceState(null, "", "#" + panels[i].id); } catch (e) {} }
}
function fromHash() { const k = panels.findIndex(p => "#" + p.id === location.hash); show(k < 0 ? 0 : k, true); }
window.addEventListener("hashchange", fromHash); fromHash();
</script>
