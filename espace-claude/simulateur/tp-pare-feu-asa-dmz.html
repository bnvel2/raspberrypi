FW1(config-network-object)#nat (dmz,outside) static 10.10.10.10
FW1(config-network-object)#exit
! 4. ACL OUTSIDE_IN : Internet ne peut joindre que le web de la DMZ (adresse réelle du serveur)
FW1(config)#access-list OUTSIDE_IN extended permit tcp any object WEB-SERVER eq www
FW1(config)#access-list OUTSIDE_IN extended permit tcp any object WEB-SERVER eq https
FW1(config)#access-list OUTSIDE_IN extended deny ip any any
FW1(config)#access-group OUTSIDE_IN in interface outside
! 5. ACL DMZ_IN : la DMZ n’initie rien vers le LAN, seulement du web et du ping vers l’extérieur
FW1(config)#access-list DMZ_IN extended deny ip 172.16.1.0 255.255.255.0 192.168.10.0 255.255.255.0
FW1(config)#access-list DMZ_IN extended permit tcp host 172.16.1.10 any eq www
FW1(config)#access-list DMZ_IN extended permit tcp host 172.16.1.10 any eq https
FW1(config)#access-list DMZ_IN extended permit icmp 172.16.1.0 255.255.255.0 any
FW1(config)#access-list DMZ_IN extended deny ip any any
FW1(config)#access-group DMZ_IN in interface dmz
! 6. Inspection ICMP : les réponses de ping reviennent sans règle supplémentaire
FW1(config)#policy-map global_policy
FW1(config-pmap)#class inspection_default
FW1(config-pmap-c)#inspect icmp
FW1(config-pmap-c)#exit
FW1(config-pmap)#exit
FW1(config)#end
FW1#write memory` },

  configNotes: [
    "PC et serveurs : pas de CLI Cisco. Saisir l’adresse, le masque et la passerelle du tableau d’adressage dans Desktop > IP Configuration. Allumer le service HTTP (et HTTPS) de SRV-WEB et de SRV-INT dans l’onglet Services.",

  ],
  tests: [
    { titre: "Test 1 — le LAN sort (depuis PC1)", lignes: `C:\\>ping 172.16.1.10

    { titre: "Test 3 — la DMZ n’atteint pas le LAN (depuis SRV-WEB, Command Prompt)", lignes: `C:\\>ping 192.168.10.10

    { titre: "Contrôles sur le pare-feu", lignes: `FW1#show interface ip brief
FW1#show nameif

  ],
  testsNotes: [
    "Test 1 : les deux pings réussissent (le premier peut perdre un paquet le temps de la résolution ARP). Dans Desktop > Web Browser, http://172.16.1.10 et http://10.20.20.20 affichent la page du serveur. show xlate sur FW1 montre alors la traduction PAT de 192.168.10.10 vers 10.10.10.2.",

  ],
  qcm: [
    { q: "Sur le pare-feu FW1, à quoi sert l’interface Gi1/3 dans ce TP ?", o: ["À relier le LAN interne", "À relier la DMZ qui héberge le serveur web", "À relier le routeur du fournisseur d’accès", "À administrer le pare-feu à distance"], r: 1, e: "Gi1/3 porte le nom dmz (172.16.1.1). Gi1/2 est inside et Gi1/1 est outside." },
    { q: "Quel niveau de sécurité est attribué à l’interface « outside » ?", o: ["0", "50", "70", "100"], r: 0, e: "outside est la zone la moins fiable : niveau 0. inside vaut 100 et dmz vaut 70." },
    { q: "Sans ACL, que devient un paquet initié depuis inside (niveau 100) vers dmz (niveau 70) ?", o: ["Il est bloqué par défaut", "Seul le ping est autorisé", "Il est autorisé, car on va d’un niveau élevé vers un niveau plus bas", "Il est autorisé seulement après une règle NAT"], r: 2, e: "L’ASA laisse passer par défaut du niveau le plus élevé vers le plus faible, et bloque l’inverse." },
    { q: "Quelle commande donne le nom « dmz » à une interface de l’ASA ?", o: ["hostname dmz", "description dmz", "vlan dmz", "nameif dmz"], r: 3, e: "nameif attribue le nom logique utilisé ensuite dans les règles, par exemple nat (dmz,outside)." },
    { q: "Dans l’objet LAN-NET, quelle ligne active le PAT vers l’adresse de l’interface outside ?", o: ["nat (inside,outside) dynamic interface", "nat (outside,inside) static interface", "ip nat inside source list 1 overload", "ip nat pool outside"], r: 0, e: "Syntaxe ASA 9.x : nat (interface source, interface destination) dynamic interface. Les deux dernières sont des syntaxes de routeur IOS." },
    { q: "Quelle adresse un visiteur d’Internet utilise-t-il pour joindre le serveur web de la DMZ ?", o: ["172.16.1.10", "192.168.10.10", "10.10.10.10", "10.20.20.20"], r: 2, e: "Le NAT statique traduit l’adresse réelle 172.16.1.10 en 10.10.10.10, l’adresse visible de l’extérieur." },
    { q: "Que fait l’ACL OUTSIDE_IN ?", o: ["Elle autorise tout le trafic vers le LAN", "Elle autorise le ping vers la DMZ", "Elle autorise le SSH vers le pare-feu", "Elle autorise HTTP et HTTPS vers le serveur web de la DMZ"], r: 3, e: "Seules deux lignes permit existent : TCP 80 et TCP 443 vers l’objet WEB-SERVER. Le reste tombe dans le deny final." },
    { q: "Dans OUTSIDE_IN (ASA 9.x), quelle destination faut-il écrire pour viser le serveur web ?", o: ["L’adresse traduite 10.10.10.10", "L’adresse réelle 172.16.1.10 (objet WEB-SERVER)", "L’adresse du routeur 10.10.10.1", "L’adresse du LAN 192.168.10.1"], r: 1, e: "Depuis la version 8.3, l’ACL est évaluée avec l’adresse réelle du serveur, après la traduction." },
    { q: "Quelle commande applique l’ACL OUTSIDE_IN en entrée de l’interface outside ?", o: ["access-group OUTSIDE_IN in interface outside", "ip access-group OUTSIDE_IN in", "access-class OUTSIDE_IN in", "apply acl OUTSIDE_IN outside"], r: 0, e: "Sur ASA : access-group nom in interface nameif. ip access-group est la syntaxe d’un routeur IOS." },
    { q: "PC-EXT n’arrive pas à pinguer 10.10.10.10 mais ouvre la page web. Pourquoi ?", o: ["Le câble est défectueux", "Le serveur web est éteint", "OUTSIDE_IN n’autorise que TCP 80 et 443 vers ce serveur : l’ICMP est refusé", "Le PAT est désactivé"], r: 2, e: "Le web passe (règles permit), le ping est de l’ICMP : il tombe dans deny ip any any." },
    { q: "À quoi sert « inspect icmp » dans la global_policy ?", o: ["À chiffrer les paquets ICMP", "À bloquer tous les pings", "À traduire l’ICMP en HTTP", "À laisser revenir les réponses ICMP des échanges lancés depuis l’intérieur"], r: 3, e: "L’inspection mémorise la requête sortante et autorise automatiquement la réponse correspondante." },
    { q: "Sans aucune ACL, que devient un paquet initié depuis dmz (70) vers inside (100) ?", o: ["Il est autorisé", "Il est bloqué, car on va d’un niveau plus bas vers un niveau plus haut", "Seul l’ICMP passe", "Il est traduit par PAT puis autorisé"], r: 1, e: "Le deny de DMZ_IN rend ce blocage explicite et visible dans les compteurs, mais il est déjà bloqué par défaut." },
    { q: "Quel est le rôle principal d’un pare-feu ?", o: ["Filtrer le trafic réseau selon des règles de sécurité", "Attribuer des adresses IP aux machines", "Traduire les noms de domaine en adresses IP", "Amplifier le signal Wi-Fi"], r: 0, e: "Un pare-feu autorise ou refuse les flux selon une politique de sécurité." },
    { q: "Qu’est-ce qu’un pare-feu « à états » (stateful) ?", o: ["Il ne regarde que les adresses MAC", "Il mémorise l’état des connexions et autorise automatiquement le trafic retour légitime", "Il chiffre toutes les communications", "Il demande une règle pour chaque paquet de retour"], r: 1, e: "Grâce à sa table de connexions (show conn), le retour d’un échange autorisé n’a pas besoin de règle." },
    { q: "Quel port TCP utilise HTTPS par défaut ?", o: ["21", "80", "443", "25"], r: 2, e: "21 : FTP, 80 : HTTP, 25 : SMTP." },
    { q: "Laquelle de ces adresses est une adresse privée (RFC 1918) ?", o: ["11.0.0.1", "172.32.0.1", "192.169.1.1", "172.16.5.4"], r: 3, e: "La plage privée de classe B va de 172.16.0.0 à 172.31.255.255 ; 172.32.0.1 est déjà publique." },
    { q: "Quel est l’intérêt d’une DMZ ?", o: ["Isoler les serveurs accessibles depuis Internet du réseau local pour limiter les dégâts en cas de compromission", "Augmenter le débit du réseau", "Remplacer le serveur DHCP", "Sauvegarder les données des utilisateurs"], r: 0, e: "Si le serveur de la DMZ est attaqué, le LAN reste protégé par le pare-feu." },
    { q: "Que fait le PAT (NAT avec surcharge) ?", o: ["Il chiffre le trafic", "Il permet à plusieurs hôtes privés de partager une seule adresse en distinguant les ports", "Il attribue automatiquement des adresses IP", "Il filtre les virus"], r: 1, e: "Chaque connexion reçoit un port source différent : c’est ce que montre show xlate." },
    { q: "Que se passe-t-il à la fin de toute ACL ?", o: ["Un permit ip any any implicite", "Un journal d’événements est créé", "Un deny ip any any implicite", "Rien de particulier"], r: 2, e: "Tout ce qui n’est pas explicitement autorisé est refusé : c’est le refus implicite." },
    { q: "Appliquer le principe du moindre privilège dans une règle de pare-feu, c’est :", o: ["Tout autoriser puis bloquer au cas par cas", "Bloquer même les administrateurs", "Autoriser tout le trafic sortant uniquement", "N’autoriser que ce qui est strictement nécessaire"], r: 3, e: "Ici : seulement TCP 80 et 443 vers un seul serveur, et rien d’autre depuis Internet." }
  ]
};

const L = ["A", "B", "C", "D"];
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function table(t) {
  const w = el("div", "wrap"), tb = el("table"), th = el("thead"), tr = el("tr");
  t.entetes.forEach(h => tr.append(el("th", "", h))); th.append(tr); tb.append(th);
  const body = el("tbody");
  t.lignes.forEach(r => { const row = el("tr"); r.forEach(c => row.append(el("td", "", c))); body.append(row); });
  tb.append(body); w.append(tb); return w;
}
const PROMPT = /^([^\s>#]+(?:\([^)]*\))?[>#])(.*)$/;
function code(titre, texte, h) {
  const box = el("div", "code"); box.style.setProperty("--h", h);
  const bar = el("div", "bar"); bar.append(el("span", "", titre));
  const btn = el("button", "", "Copier les commandes"); btn.type = "button"; bar.append(btn);
  const pre = el("pre"); const cmds = [];
  texte.split("\n").forEach((ligne, i) => {
    if (i) pre.append("\n");
    if (ligne.trim().startsWith("!")) { pre.append(el("span", "c", ligne)); return; }
    const m = ligne.match(PROMPT);
    if (m) { pre.append(el("span", "p", m[1]), el("span", "m", m[2])); cmds.push(m[2]); }
    else { pre.append(ligne); }
  });
  btn.onclick = async () => {
    const t = cmds.join("\n");
    try { await navigator.clipboard.writeText(t); btn.textContent = "Copié ✔"; }
    catch (e) { const ta = el("textarea"); ta.value = t; document.body.append(ta); ta.select(); try { document.execCommand("copy"); btn.textContent = "Copié ✔"; } catch (e2) { btn.textContent = "Copie impossible"; } ta.remove(); }
    setTimeout(() => btn.textContent = "Copier les commandes", 1800);
  };
  box.append(bar, pre); return box;
}
function P(id) { return document.getElementById(id); }
function hue(id) { return P(id).dataset.h; }

document.title = TP.titre; P("titre").textContent = TP.titre; P("soustitre").textContent = TP.sousTitre;

(function () {
  const s = P("enonce"); s.append(el("h2", "", "Énoncé du TP"));
  TP.enonce.forEach(t => s.append(el("p", "", t)));
  s.append(el("h3", "", "Objectifs")); const ul = el("ul", "obj"); TP.objectifs.forEach(o => ul.append(el("li", "", o))); s.append(ul);
  s.append(el("h3", "", "Matériel")); const um = el("ul", "obj"); TP.materiel.forEach(o => um.append(el("li", "", o))); s.append(um);
})();

(function () {
  const s = P("adressage"); s.append(el("h2", "", "Plan d’adressage"));
  s.append(el("h3", "", "Réseaux")); s.append(table(TP.reseaux));
  s.append(el("h3", "", "Adresses des appareils")); s.append(table(TP.adressage));
  s.append(el("h3", "", "Table des liens (câblage)")); s.append(table(TP.liens));
  if (TP.flux) { s.append(el("h3", "", "Politique de filtrage (matrice des flux)")); s.append(table(TP.flux)); }
})();

(function () {
  const s = P("config"); s.append(el("h2", "", "Configuration CLI"));
  s.append(el("div", "note", "Chaque commande est précédée de son prompt. Le bouton « Copier » ne copie que les commandes, sans les prompts."));
  TP.configs.forEach(c => s.append(code(c.appareil, c.lignes, hue("config"))));
  (TP.configNotes || []).forEach(n => s.append(el("div", "note", n)));
})();

(function () {
  const s = P("tests"); s.append(el("h2", "", "Vérifications et tests"));
  TP.tests.forEach(t => s.append(code(t.titre, t.lignes, hue("tests"))));
  (TP.testsNotes || []).forEach(n => s.append(el("div", "note", n)));
})();

(function () {
  const s = P("qcm"); s.append(el("h2", "", "QCM — " + TP.qcm.length + " questions"));
  const cards = [];
  TP.qcm.forEach((q, i) => {
    const c = el("div", "q"); c.append(el("p", "", (i + 1) + ". " + q.q));
    q.o.forEach((o, j) => {
      const lab = el("label"); const r = el("input"); r.type = "radio"; r.name = "q" + i; r.value = j;
      lab.append(r, " " + L[j] + ". " + o); c.append(lab);
    });
    cards.push(c); s.append(c);
  });
  const btn = el("button", "btn", "Valider mes réponses"); btn.type = "button";
  const sc = el("span"); sc.id = "score"; sc.setAttribute("aria-live", "polite");
  btn.onclick = () => {
    let ok = 0;
    TP.qcm.forEach((q, i) => {
      const ch = document.querySelector('input[name="q' + i + '"]:checked');
      const good = ch && Number(ch.value) === q.r; if (good) ok++;
      cards[i].classList.toggle("ok", !!good); cards[i].classList.toggle("ko", !good);
    });
    sc.textContent = "Score : " + ok + " / " + TP.qcm.length + " — explications dans l’onglet Corrigé";
  };
  s.append(btn, sc);
})();

(function () {
  const s = P("corrige"); s.append(el("h2", "", "Corrigé du QCM"));
  const g = el("p", "grille", TP.qcm.map((q, i) => (i + 1) + "-" + L[q.r]).join("  ·  ")); s.append(g);
  TP.qcm.forEach((q, i) => {
    const c = el("div", "q"); c.append(el("p", "", (i + 1) + ". " + q.q));
    c.append(el("div", "", "Réponse " + L[q.r] + " — " + q.o[q.r])); c.append(el("div", "note", q.e)); s.append(c);
  });
})();

const panels = Array.from(document.querySelectorAll("section.panel")), nav = P("tabs");
panels.forEach((p, i) => {
  p.style.setProperty("--h", p.dataset.h);
  const b = el("button", "tab", p.dataset.label); b.type = "button"; b.setAttribute("role", "tab");
  b.style.setProperty("--h", p.dataset.h); b.onclick = () => show(i); nav.append(b);
});
function show(i, noHash) {
  panels.forEach((p, j) => { p.hidden = j !== i; nav.children[j].classList.toggle("on", j === i); nav.children[j].setAttribute("aria-selected", j === i ? "true" : "false"); });
  if (!noHash) { try { history.replaceState(null, "", "#" + panels[i].id); } catch (e) {} }
}
function fromHash() { const k = panels.findIndex(p => "#" + p.id === location.hash); show(k < 0 ? 0 : k, true); }
window.addEventListener("hashchange", fromHash); fromHash();
</script>
